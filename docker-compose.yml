services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MRBS_HTTP_PORT:-8080}:80"
    environment:
      MRBS_TIMEZONE: "${MRBS_TIMEZONE:-America/New_York}"
      MRBS_DB_SYSTEM: "mysql"
      MRBS_DB_HOST: "db"
      MRBS_DB_DATABASE: "${MYSQL_DATABASE:-mrbs}"
      MRBS_DB_USER: "${MYSQL_USER:-mrbs}"
      MRBS_DB_PASSWORD: "${MYSQL_PASSWORD:-mrbs}"
      MRBS_DB_TBL_PREFIX: "${MRBS_DB_TBL_PREFIX:-mrbs_}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-mrbs}"
      MYSQL_USER: "${MYSQL_USER:-mrbs}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-mrbs}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-mrbs-root}"
    volumes:
      - mrbs_mysql_data:/var/lib/mysql
      - ./tables.my.sql:/docker-entrypoint-initdb.d/010-tables.sql:ro
      - ./docs/fdny-room-seed.my.sql:/docker-entrypoint-initdb.d/020-fdny-rooms.sql:ro
      - ./docs/fdny-sample-bookings.my.sql:/docker-entrypoint-initdb.d/030-fdny-sample-bookings.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mrbs-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8888}:80"
    environment:
      PMA_HOST: db
      PMA_USER: "${MYSQL_USER:-mrbs}"
      PMA_PASSWORD: "${MYSQL_PASSWORD:-mrbs}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mrbs_mysql_data:
