services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MRBS_HTTP_PORT:-8080}:80"
    environment:
      MRBS_TIMEZONE: "${MRBS_TIMEZONE:-America/New_York}"
      MRBS_DB_SYSTEM: "mysql"
      MRBS_DB_HOST: "db"
      MRBS_DB_DATABASE: "${MYSQL_DATABASE}"
      MRBS_DB_USER: "${MYSQL_USER}"
      MRBS_DB_PASSWORD: "${MYSQL_PASSWORD}"
      MRBS_DB_TBL_PREFIX: "${MRBS_DB_TBL_PREFIX:-mrbs_}"
      MRBS_LOAD_SAMPLE_BOOKINGS: "${MRBS_LOAD_SAMPLE_BOOKINGS:-0}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - mrbs_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8888}:80"
    environment:
      PMA_HOST: db
      PMA_USER: "${MYSQL_USER}"
      PMA_PASSWORD: "${MYSQL_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mrbs_mysql_data:
